[package]
name = "orbit-tape"
version.workspace = true
authors.workspace = true
readme = "README.md"
license = "GPL-3.0-or-later"
description = "A native crypto charting desk for the COSMIC desktop"
categories = ["finance", "visualization", "gui"]
edition.workspace = true
repository.workspace = true
homepage.workspace = true

# .deb built with cargo-deb, see scripts/package-deb.sh.
[package.metadata.deb]
name = "orbit-tape"
maintainer = "atraxsrc <92285717+atraxsrc@users.noreply.github.com>"
# DEP-5 copyright file pointing at /usr/share/common-licenses.
license-file = ["packaging/debian/copyright", "0"]
changelog = "packaging/debian/changelog"
section = "misc"
priority = "optional"
extended-description = """\
Orbit Tape is a native crypto charting desk for the COSMIC desktop, a fork \
of Flowsurface. It streams trades and order books from Binance, Bybit, \
Hyperliquid, OKX and MEXC and shows them as heatmaps, footprint and \
candlestick charts, time and sales and a DOM ladder, with scriptable \
indicators and desktop alerts. Includes orbit-tape-indicator, the CLI for \
writing and testing indicator scripts."""
# $auto finds directly linked libraries (ALSA). Graphics, Wayland and
# keyboard libraries are loaded at runtime with dlopen, so they are listed
# here. Wayland only: there is no X11 backend.
depends = "$auto, libvulkan1, libwayland-client0, libwayland-egl1, libegl1, libxkbcommon0"
recommends = "mesa-vulkan-drivers"
assets = [
    ["target/release/orbit-tape", "usr/bin/", "755"],
    ["target/release/orbit-tape-indicator", "usr/bin/", "755"],
    ["packaging/linux/io.github.atraxsrc.OrbitTape.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/io.github.atraxsrc.OrbitTape.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/linux/orbit-tape-scan.service", "usr/lib/systemd/user/", "644"],
    ["packaging/linux/orbit-tape-scan.timer", "usr/lib/systemd/user/", "644"],
    ["packaging/linux/orbit-tape-watch.service", "usr/lib/systemd/user/", "644"],
    ["packaging/linux/orbit-tape-report.service", "usr/lib/systemd/user/", "644"],
    ["packaging/linux/orbit-tape-report.timer", "usr/lib/systemd/user/", "644"],
    ["assets/app-icon/hicolor/16x16/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["assets/app-icon/hicolor/24x24/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["assets/app-icon/hicolor/32x32/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["assets/app-icon/hicolor/48x48/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["assets/app-icon/hicolor/64x64/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["assets/app-icon/hicolor/128x128/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["assets/app-icon/hicolor/256x256/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/app-icon/hicolor/512x512/apps/io.github.atraxsrc.OrbitTape.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["assets/app-icon/hicolor/scalable/apps/io.github.atraxsrc.OrbitTape.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["LICENSE", "usr/share/doc/orbit-tape/LICENSE", "644"],
    ["indicator-engine/LICENSE", "usr/share/doc/orbit-tape/LICENSE-Apache-2.0-indicator-engine", "644"],
    ["exchange/LICENSE", "usr/share/doc/orbit-tape/LICENSE-MIT-exchange", "644"],
    ["indicators/roman/*.ind", "usr/share/doc/orbit-tape/indicators/roman/", "644"],
    ["indicators/market/*.ind", "usr/share/doc/orbit-tape/indicators/market/", "644"],
    ["examples/indicators/*.ind", "usr/share/doc/orbit-tape/examples/indicators/", "644"],
    ["docs/custom-indicators.md", "usr/share/doc/orbit-tape/custom-indicators.md", "644"],
    ["docs/mcp.md", "usr/share/doc/orbit-tape/mcp.md", "644"],
    ["docs/plan.example.toml", "usr/share/doc/orbit-tape/plan.example.toml", "644"],
    ["README.md", "usr/share/doc/orbit-tape/README.md", "644"],
]

[workspace.package]
version = "0.13.0"
edition = "2024"
authors = ["atraxsrc <92285717+atraxsrc@users.noreply.github.com>"]
repository = "https://github.com/atraxsrc/orbit-tape"
homepage = "https://github.com/atraxsrc/orbit-tape"

[workspace]
members = [ "data", "exchange", "indicator-engine"]

[workspace.dependencies]
iced_core = { version = "0.14.0", features = ["serde"] }
chrono = { version = "0.4.44", default-features = false, features = ["serde", "now", "clock"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.149"
log = "0.4.29"
thiserror = "2.0.18"
regex = "1.12.3"
palette = "0.7.6"
num-traits = "0.2.19"
rustc-hash = "2.1.2"
enum-map = { version = "2.7.3", features = ["serde"] }
url = "2.5.8"
rand = "0.10.1"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
data = { version = "0.13.0", path = "data", package = "orbit-tape-data" }
exchange = { version = "0.13.0", path = "exchange", package = "orbit-tape-exchange" }
indicator_engine = { version = "0.13.0", path = "indicator-engine", package = "orbit-tape-indicator-engine" }
arrow-ipc = { version = "59.1", default-features = false }
arrow-array = { version = "59.1", default-features = false }
arrow-schema = { version = "59.1", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.52.3", default-features = false, features = ["rt"] }

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu",
    "tokio",
    "canvas",
    "sipper",
    "advanced",
    "unconditional-rendering",
    "crisp",
    "wayland",
] }
iced_core.workspace = true
chrono.workspace = true
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
uuid.workspace = true
palette.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true
enum-map.workspace = true
url.workspace = true
ring = "0.17.14"
fern = "0.7.1"
reqwest.workspace = true
tokio = { workspace = true, features = ["macros", "time", "sync"] }
rodio = { version = "0.22.2", default-features = false, features = [ "playback", "wav" ]}
# Desktop notifications for indicator alerts (freedesktop spec over zbus), see
# src/alerts.rs.
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
# Live reload of user indicator files (inotify), see src/indicator_watch.rs.
notify = { version = "8.2", default-features = false }
# `orbit-tape mcp`: Model Context Protocol server over stdio (Apache-2.0),
# see src/mcp.rs.
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"

bytemuck = "1.25.0"
iced_wgpu = "0.14.0"
exchange.workspace = true
arrow-ipc.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bytes = "1.11.1"
data.workspace = true
indicator_engine.workspace = true
# Window blur on compositors without KDE's blur protocol (COSMIC), see src/blur.rs.
# All already in the tree through winit.
raw-window-handle = "0.6.2"
wayland-backend = { version = "0.3.15", features = ["client_system"] }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client", "staging"] }

[features]
debug = ["iced/hot"]


[profile.packaging]
inherits = "release"
lto = "fat"
codegen-units = 1
