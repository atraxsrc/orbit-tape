<?xml version="1.0" encoding="UTF-8"?>
<!-- Orbit Tape app icon. SPDX-License-Identifier: GPL-3.0-or-later -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Orbit Tape</title>
  <!-- Tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#1E2430"/>
  <g transform="translate(256 286) rotate(-14)">
    <!-- Orbit, back half (behind the candles) -->
    <path d="M -196 0 A 196 72 0 0 1 196 0" fill="none" stroke="#B48A2C" stroke-width="30" stroke-linecap="round"/>
  </g>
  <!-- Candles: up, down, up -->
  <g stroke-linecap="round">
    <line x1="174" y1="206" x2="174" y2="350" stroke="#4FD1A0" stroke-width="18"/>
    <rect x="142" y="232" width="64" height="96" rx="12" fill="#4FD1A0"/>
    <line x1="256" y1="160" x2="256" y2="318" stroke="#F0716C" stroke-width="18"/>
    <rect x="224" y="182" width="64" height="108" rx="12" fill="#F0716C"/>
    <line x1="338" y1="118" x2="338" y2="282" stroke="#4FD1A0" stroke-width="18"/>
    <rect x="306" y="138" width="64" height="122" rx="12" fill="#4FD1A0"/>
  </g>
  <g transform="translate(256 286) rotate(-14)">
    <!-- Orbit, front half (over the candles), with a thin gap -->
    <path d="M -196 0 A 196 72 0 0 0 196 0" fill="none" stroke="#1E2430" stroke-width="46" stroke-linecap="round"/>
    <path d="M -196 0 A 196 72 0 0 0 196 0" fill="none" stroke="#F2C14E" stroke-width="30" stroke-linecap="round"/>
    <!-- Satellite -->
    <circle cx="196" cy="0" r="36" fill="#1E2430"/>
    <circle cx="196" cy="0" r="24" fill="#F7E3A1"/>
  </g>
</svg>
