name: CI

# Runs on every pull request and on pushes to main. Every job uses the Rust
# version pinned in rust-toolchain.toml, so local checks with that toolchain
# match CI.
on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    private-files:
        name: No local-only files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: No local-only files tracked
              run: sh scripts/check-private-files.sh

    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  test -n "$channel"
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}
                  components: rustfmt

            - name: Check format
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy
        if: ${{ github.actor != 'dependabot[bot]' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Linux system dependencies
              run: |
                  # The runner image's Microsoft repo can fail (403, unsigned)
                  # and break apt-get update; nothing here needs it.
                  grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libasound2-dev

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  test -n "$channel"
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}
                  components: clippy

            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-clippy-

            - name: Run cargo clippy
              run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

    test:
        name: Tests and indicator checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Install Linux system dependencies
              run: |
                  grep -l packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libasound2-dev

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  test -n "$channel"
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}

            - uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-test-

            # Every crate: app, data, exchange adapters, indicator engine, and
            # the end-to-end tests in tests/ (MCP over stdio, report CLI).
            # None of them needs the network.
            - name: Test workspace
              run: cargo test --workspace --locked

            - name: Check indicators
              run: |
                  for dir in indicators/roman indicators/market examples/indicators; do
                      echo "== $dir"
                      cargo run --quiet --locked -p orbit-tape-indicator-engine --bin orbit-tape-indicator -- check "$dir"
                  done

            - name: Smoke-test bundled indicators
              run: cargo run --quiet --locked -p orbit-tape-indicator-engine --bin orbit-tape-indicator -- test data/indicators/sources --namespace core
