name: Clippy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main, 'chart-rewrite/**']
    workflow_dispatch:

jobs:
    clippy:
        if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Install Linux system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libasound2-dev

            - name: Read rust toolchain from rust-toolchain.toml
              id: rust_toolchain
              run: |
                  channel="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
                  if [ -z "$channel" ]; then
                      echo "Failed to read toolchain channel from rust-toolchain.toml" >&2
                      exit 1
                  fi
                  echo "channel=$channel" >> "$GITHUB_OUTPUT"

            - name: Install rust toolchain + clippy
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: ${{ steps.rust_toolchain.outputs.channel }}
                  components: clippy

            - name: Cache cargo registry & target
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Fetch dependencies
              run: cargo fetch

            - name: Test indicator engine
              if: github.event_name == 'workflow_dispatch'
              run: cargo test -p orbit-tape-indicator-engine --locked

            - name: Test application
              if: github.event_name == 'workflow_dispatch'
              run: cargo test -p orbit-tape --bin orbit-tape --locked

            - name: Validate repository indicator sources
              if: github.event_name == 'workflow_dispatch'
              run: cargo test -p orbit-tape-data --lib --locked

            - name: Smoke-test bundled indicator sources
              if: github.event_name == 'workflow_dispatch'
              run: cargo run --locked -p orbit-tape-indicator-engine --bin orbit-tape-indicator -- test data/indicators/sources --namespace core

            - name: Verify workspace packages
              if: github.event_name == 'workflow_dispatch'
              run: cargo package --workspace --locked --target-dir "$(mktemp -d)"

            - name: Run cargo clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
