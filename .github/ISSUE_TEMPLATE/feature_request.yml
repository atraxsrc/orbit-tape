name: Feature request
description: An idea or a small improvement.
labels: [enhancement]
body:
    - type: markdown
      attributes:
          value: |
              Orbit Tape is in polish mode (see the README's Roadmap), so small, focused ideas have the best chance.
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: The problem or workflow, before any solution.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: What would help?
    - type: checkboxes
      id: contribute
      attributes:
          label: Contributing
          options:
              - label: I would like to send a pull request for this.
